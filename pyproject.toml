[project]
name = "guard-mcp-server"
version = "0.0.2"
description = "An MCP server that enables AI agents to analyze media for moderation via the Guard API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Elhio" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "fastmcp",
    "content-moderation",
    "content-safety",
    "ai-generated",
    "deepfake",
    "violence",
    "image-moderation",
    "video-moderation",
    "trust-and-safety",
    "agent-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp[tasks]==4.0.0b2",
    "fastmcp-slim[client,server]==4.0.0b2",
    "fastmcp-tasks==4.0.0b2",
    "guard-client>=0.0.2",
    "httpx>=0.28.1,<1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
local = ["guard-client[local]>=0.0.2"]

[project.scripts]
guard-mcp = "guard_mcp.server:main"
guard-mcp-server = "guard_mcp.server:main"

[project.urls]
Homepage = "https://elhio.com/"
Repository = "https://github.com/elhio/guard-mcp-server"
Issues = "https://github.com/elhio/guard-mcp-server/issues"
Changelog = "https://github.com/elhio/guard-mcp-server/releases"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
docs = [
    "griffe>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"
markers = [
    "slow: spawns a subprocess; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
extend-select = ["D213"]
ignore = [
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    "D200",
    "D212",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastmcp.dependencies.Progress",
    "fastmcp.dependencies.Shared",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D101", "D102", "D103", "D107"]
"src/guard_mcp/tools/**" = ["D417"]
"src/guard_mcp/resources.py" = ["D417"]

[tool.mypy]
packages = ["guard_mcp"]
strict = true

[[tool.mypy.overrides]]
module = ["guard_local", "guard_local.*", "fastmcp_tasks", "fastmcp_tasks.*"]
ignore_missing_imports = true
